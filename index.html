<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SciFig</title>
<script>window.coi = { coepCredentialless: () => !!window.chrome, quiet: true };</script>
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
</head>
<body>
<div id="app">
  <header id="menubar">
    <span class="brand">SciFig</span>
    <nav id="menus"></nav>
    <span class="spacer"></span>
    <button id="searchBtn" title="Search every tool, command and help topic"><svg viewBox="0 0 20 20" width="14" height="14"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="1.6"/></svg><span>Search tools and help</span><kbd id="searchKey"></kbd></button>
    <button id="fsBtn" data-cmd="view.fullscreen">⛶</button>
  </header>
  <div id="main">
    <aside id="toolbar"></aside>
    <div id="center">
      <div id="tabs"></div>
      <div id="stage">
        <div id="corner"></div>
        <canvas id="rulerH"></canvas>
        <canvas id="rulerV"></canvas>
        <div id="viewport">
          <canvas id="scene"></canvas>
          <canvas id="over"></canvas>
          <div id="npanel"><div id="npHead"><span id="npTitle"></span><button id="npToggle"></button></div><div id="optbar"></div></div>
          <div id="empty">
            <h1>SciFig</h1>
            <p>Drop an image, PSD, TIFF, HEIC, camera raw, SVG, PDF or EPS here</p>
            <p><button data-cmd="file.new">New document</button> <button data-cmd="file.open">Open file…</button> <button data-cmd="help.sample">Open sample figure</button></p>
          </div>
        </div>
      </div>
    </div>
    <aside id="panels">
      <section class="panel" id="p-color"><h3 class="fold">Colour</h3><div class="body" id="colorPanel"></div></section>
      <section class="panel" id="p-props"><h3 class="fold">Properties</h3><div class="body" id="props"></div></section>
      <section class="panel" id="p-layers"><h3 class="ptabs"><span data-tab="layers" class="on">Layers</span><span data-tab="channels">Channels</span></h3>
        <div id="tabLayers" class="tabbody">
          <div class="layer-head" id="layerHead"></div>
          <div class="body" id="layers"></div>
          <div class="layer-foot" id="layerFoot"></div>
        </div>
        <div id="tabChannels" class="tabbody" hidden></div>
      </section>
    </aside>
  </div>
  <footer id="status"></footer>
</div>
<div id="toast"></div>
<input type="file" id="fileInput" multiple hidden>
<script src="vendor/pako.min.js"></script>
<script src="vendor/UTIF.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
